[project]
name = "animunculi-mcp"
version = "0.4.4"
description = "MCP server that embodies an AI agent in Skyrim through the Animunculi SKSE plugin"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
animunculi-mcp = "animunculi_mcp.server:main"
animunculi-mock-game = "animunculi_mcp.mock_game:main"
animunculi-watch = "animunculi_mcp.watch:main"
animunculi-mcpl = "animunculi_mcp.mcpl.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/animunculi_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest-tmp -p no:cacheprovider"
