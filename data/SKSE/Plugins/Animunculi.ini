; Animunculi - embodied AI agents for Skyrim
; Changes take effect the next time the game starts.

[Server]
Enabled = true
; 127.0.0.1 keeps the agent bridge private to this PC. Use 0.0.0.0 only if the agent runs elsewhere
; on your LAN (then set a Token below and keep it secret).
BindAddress = 127.0.0.1
Port = 47700
; Leave blank for a fresh random token each session (published in
; Documents/My Games/Skyrim Special Edition/SKSE/Animunculi.discovery.json, which the MCP reads).
Token =

[Perception]
DefaultRadiusMeters = 40
MaxRadiusMeters = 150
; true = agents only perceive what their body has line of sight to
RequireLineOfSight = false

[Voice]
Enabled = true
; 0.0 - 4.0, multiplied with the game's master volume when FollowMasterVolume is true
Volume = 1.0
FollowMasterVolume = true
; subtitle     = standard subtitles, like NPC dialogue
; notification = top-left HUD notification ("Lydia: ...")
; none         = voice only
SubtitleMode = subtitle
LipSync = true
LipSyncGain = 1.0
FullVolumeDistanceMeters = 4
SilentDistanceMeters = 45

[Vision]
Enabled = true
; Lets agents look through their own eyes: the camera jumps to the free camera at the agent's
; eyes for a few frames (like Photo Mode), then returns. You will see a brief flicker.
AllowAgentPerspective = true
MaxDimension = 1568
; Where see(save=true) keepsakes go (full-resolution PNG). Blank = Documents\My Games\Skyrim Special Edition\Screenshots\Animunculi
KeepsakeFolder =

[Actions]
Enabled = true
AllowAttack = true
AllowAttackPlayer = false
AllowReadPlayerInventory = true

[Chat]
; Needs SKSE Menu Framework. The hotkey toggles a small chat window for typing to your companion.
Enabled = true
; DirectInput scan code: 0x2B = backslash, 0x35 = slash, 0x1A = [, 0x1B = ]
Hotkey = 0x2B
PauseGame = true

[Debug]
; Lets agents run arbitrary console commands. Leave false unless you are developing.
AllowConsole = false
LogLevel = info
